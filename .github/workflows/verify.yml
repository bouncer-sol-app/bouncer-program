name: Reproducible build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install solana-verify
        run: cargo install solana-verify --locked
      - name: Deterministic build
        run: |
          # Newest published verifiable-build image
          V=$(curl -s "https://hub.docker.com/v2/repositories/solanafoundation/solana-verifiable-build/tags?page_size=100" \
            | jq -r '.results[].name' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "Image $V"
          echo "::notice title=Image::solanafoundation/solana-verifiable-build:$V"
          solana-verify build --library-name bouncer --base-image solanafoundation/solana-verifiable-build:$V
      - name: Build hash
        run: |
          HASH=$(solana-verify get-executable-hash target/deploy/bouncer.so)
          echo "::notice title=Build hash::$HASH"
      - uses: actions/upload-artifact@v4
        with:
          name: bouncer-so
          path: target/deploy/bouncer.so
