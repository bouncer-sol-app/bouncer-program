[package]
name = "bouncer"
version = "0.1.0"
description = "Bouncer launchpad: one X account, one wallet, 3% max per token"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bouncer"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=1.2.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.2.2" }
